interface:
  display_name: "Feat"
  short_description: "Scaffold a feature brief, plan it, then build it into a PR"
  default_prompt: "Use $feat create NAME to scaffold a feature brief, $feat plan NAME to turn it into a reviewable plan, optionally followed by assume, then $feat run NAME to implement that plan. Example: $feat plan account-export"
policy:
  allow_implicit_invocation: false
